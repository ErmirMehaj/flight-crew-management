services:
  postgres:
    image: postgres:16-alpine
    container_name: flightcrew-postgres
    environment:
      POSTGRES_DB: flightcrew
      POSTGRES_USER: flightcrew
      POSTGRES_PASSWORD: flightcrew
    ports:
      # Host port 5433 (not 5432) to avoid clashing with a local Postgres
      # install on the same machine -- the container's internal port stays
      # 5432, only the host-side mapping changes.
      - "5433:5432"
    volumes:
      - flightcrew-pgdata:/var/lib/postgresql/data

volumes:
  flightcrew-pgdata:
