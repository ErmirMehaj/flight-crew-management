spring:
  application:
    name: flight-crew-management

  datasource:
    url: jdbc:postgresql://localhost:5432/flightcrew
    username: flightcrew
    password: flightcrew

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

crew:
  # Max hours a crew member may work within a rolling 7-day window
  # (window = [flight date - 6 days, flight date]).
  max-weekly-hours: 40

logging:
  level:
    com.mehaj.flightcrew: DEBUG
